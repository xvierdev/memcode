services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: memcode_api:dev
    container_name: memcode_api
    env_file:
      - .env
    networks:
      - memcode_network
    ports:
      - "${API_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: memcode_frontend:dev
    container_name: memcode_frontend
    env_file:
      - .env
    networks:
      - memcode_network
    ports:
      - "${WEB_PORT:-80}:80"

networks:
  memcode_network:
    driver: bridge

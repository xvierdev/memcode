resolver 127.0.0.11 valid=10s ipv6=off;

upstream memcode_backends {
    zone memcode_backends 64k;
    server backend1:8000 resolve max_fails=2 fail_timeout=10s;
    server backend2:8000 resolve max_fails=2 fail_timeout=10s;
    server backend3:8000 resolve max_fails=2 fail_timeout=10s;
}

server {
    listen 80;
    server_name localhost;

    location /api/ {
        proxy_pass http://memcode_backends/;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}